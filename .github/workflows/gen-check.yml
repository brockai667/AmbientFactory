name: gen-check (diag)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: list groq models
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          tok = os.environ["MODELS_TOKEN"]
          req = urllib.request.Request("https://api.groq.com/openai/v1/models",
                headers={"Authorization":"Bearer "+tok,"User-Agent":"Mozilla/5.0"})
          try:
              d = json.loads(urllib.request.urlopen(req, timeout=40).read().decode())
              ids = sorted(m["id"] for m in d.get("data",[]))
              print("MODELS:", json.dumps(ids))
          except urllib.error.HTTPError as e:
              print("HTTP", e.code, e.read().decode()[:400])
          PY
