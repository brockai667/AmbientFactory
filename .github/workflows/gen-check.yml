name: gen-check (diag)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: probe response shape
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error, time
          tok = os.environ["MODELS_TOKEN"]
          msgs=[{"role":"system","content":"Respond with ONLY a JSON object."},{"role":"user","content":"Give me a JSON object {\"title\":\"...\",\"steps\":[\"a\",\"b\",\"c\"]} about a funny money trick. ONLY JSON."}]
          for model, extra in (("openai/gpt-oss-120b",{}),("openai/gpt-oss-120b",{"reasoning_effort":"low"}),("openai/gpt-oss-20b",{"reasoning_effort":"low"}),("qwen/qwen3.6-27b",{}),("groq/compound-mini",{})):
              body=json.dumps({"model":model,"messages":msgs,"max_tokens":600,**extra}).encode()
              req=urllib.request.Request("https://api.groq.com/openai/v1/chat/completions",data=body,headers={"Authorization":"Bearer "+tok,"Content-Type":"application/json","User-Agent":"diag/1.0"})
              try:
                  r=json.loads(urllib.request.urlopen(req,timeout=60).read().decode())
                  m=r["choices"][0]["message"]; c=m.get("content") or ""; rs=m.get("reasoning") or ""
                  print(f"{model} {extra}: finish={r['choices'][0].get('finish_reason')} content_len={len(c)} reasoning_len={len(rs)} completion_tokens={r.get('usage',{}).get('completion_tokens')} | content[:100]={c[:100]!r}")
              except urllib.error.HTTPError as e:
                  print(model, extra, "HTTP", e.code, e.read().decode()[:260])
              time.sleep(4)
          PY
