name: Money Glitch Daily

on:
  schedule:
    - cron: "47 2 * * *"     # 02:47 UTC = 04:47 Bratislava (v noci; denne 1 reel/kanal)
  workflow_dispatch: {}

permissions:
  contents: write
  models: read

concurrency:
  group: glitch-daily
  cancel-in-progress: false

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install numpy pillow requests edge-tts

      - name: Prepare config
        run: cp config.example.json config.json

      - name: Render + upload money-glitch reel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
          MODELS_BASE_URL: https://api.groq.com/openai/v1
          MODELS_MODEL: llama-3.3-70b-versatile
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_FOCUS: ${{ secrets.YT_REFRESH_FOCUS }}
          YT_REFRESH_STUDY: ${{ secrets.YT_REFRESH_STUDY }}
          YT_REFRESH_SLEEP: ${{ secrets.YT_REFRESH_SLEEP }}
        run: python glitch_daily.py

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f config.json
          git add used.json bank.json 2>/dev/null || true
          git commit -m "state: glitch run $(date -u +%F)" || echo "no changes to commit"
          for _i in 1 2 3 4; do git pull --rebase -q origin main && git push -q && break || sleep 4; done
